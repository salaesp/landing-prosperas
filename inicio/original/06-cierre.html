<section class="cg-final-cta-section" aria-labelledby="cg-final-cta-title">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap');

    .cg-final-cta-section,
    .cg-final-cta-section * {
      box-sizing: border-box;
    }

    .cg-final-cta-section {
      width: 100vw;
      max-width: 100vw;
      margin-left: calc(50% - 50vw);
      margin-right: calc(50% - 50vw);
      background: #710507;
      font-family: 'Poppins', sans-serif;
      color: #fff8f3;
      padding: 58px 18px;
      overflow: hidden;
      text-align: center;
    }

    .cg-final-cta-section__wrap {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
    }

    .cg-final-cta-section__title {
      margin: 0 auto;
      max-width: 760px;
      font-size: clamp(30px, 4.8vw, 56px);
      line-height: 1.06;
      font-weight: 500;
      letter-spacing: -0.045em;
      color: #ffffff;
      text-wrap: balance;
    }

    .cg-final-cta-section__title strong {
      display: block;
      font-weight: 800;
      color: #f9a2c6;
    }

    .cg-final-cta-section__script {
      display: inline-block;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 1.28em;
      line-height: 0.85;
      color: #f9a2c6;
      letter-spacing: -0.02em;
      margin-top: 4px;
    }

    .cg-final-cta-section__text {
      max-width: 560px;
      margin: 22px auto 0;
      font-size: clamp(15px, 1.8vw, 18px);
      line-height: 1.65;
      font-weight: 500;
      color: rgba(255, 248, 243, 0.9);
    }

    .cg-final-cta-section__actions {
      display: flex;
      justify-content: center;
      margin-top: 30px;
    }

    .cg-final-cta-section__btn,
    .cg-final-cta-section__btn:hover,
    .cg-final-cta-section__btn:focus,
    .cg-final-cta-section__btn:active,
    .cg-final-cta-section__btn:visited {
      text-decoration: none !important;
      color: #9a1f3a !important;
    }

    .cg-final-cta-section__btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      width: 100%;
      max-width: 220px;
      padding: 14px 22px;
      border-radius: 999px;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background: #f9a2c6;
      border: 1px solid #f9a2c6;
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.16);
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
    }

    .cg-final-cta-section__btn::before {
      content: "";
      position: absolute;
      inset: -45%;
      background: linear-gradient(
        115deg,
        transparent 0%,
        transparent 37%,
        rgba(255, 255, 255, 0.62) 48%,
        rgba(255, 255, 255, 0.35) 52%,
        transparent 64%,
        transparent 100%
      );
      transform: translateX(-85%) rotate(6deg);
      animation: cgFinalButtonShine 4s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
    }

    .cg-final-cta-section__btn:hover {
      background: #bfa9cb;
      border-color: #bfa9cb;
      transform: translateY(-2px);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.2);
    }

    .cg-final-cta-section__btn:focus {
      outline: 3px solid rgba(249, 162, 198, 0.42);
      outline-offset: 3px;
    }

    @keyframes cgFinalButtonShine {
      0%, 48% {
        transform: translateX(-85%) rotate(6deg);
        opacity: 0;
      }

      58% {
        opacity: 1;
      }

      78%, 100% {
        transform: translateX(85%) rotate(6deg);
        opacity: 0;
      }
    }

    @media (min-width: 760px) {
      .cg-final-cta-section {
        padding: 76px 28px;
      }

      .cg-final-cta-section__btn {
        width: auto;
        min-width: 190px;
      }
    }

    @media (max-width: 420px) {
      .cg-final-cta-section {
        padding: 48px 14px;
      }

      .cg-final-cta-section__title {
        font-size: clamp(29px, 8.8vw, 40px);
        line-height: 1.08;
      }

      .cg-final-cta-section__script {
        font-size: 1.18em;
      }

      .cg-final-cta-section__text {
        font-size: 14px;
        margin-top: 18px;
      }

      .cg-final-cta-section__btn {
        max-width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cg-final-cta-section__btn::before {
        animation: none;
      }

      .cg-final-cta-section__btn {
        transition: none;
      }
    }
  </style>

  <div class="cg-final-cta-section__wrap">
    <h2 class="cg-final-cta-section__title" id="cg-final-cta-title">
      Tu emprendimiento no empieza cuando sabés todo.
      <strong><span class="cg-final-cta-section__script">Empieza cuando accionás.</span></strong>
    </h2>

    <p class="cg-final-cta-section__text">
      Elegí un taller y empezá a construir algo propio.
    </p>

    <div class="cg-final-cta-section__actions">
      <a class="cg-final-cta-section__btn" href="#talleres">
        Quiero empezar
      </a>
    </div>
  </div>
</section>
